<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TTD Online Services</title>
  </head>
  <body>
    <!--
      Simulates a framework-controlled input (React-style value tracking):
      state only updates from bubbling "input" events, and every re-render
      writes state back into the DOM. A value assigned without an input
      event is wiped on the next render.
    -->
    <h1>Special Entry Darshan</h1>
    <h2>Pilgrim Details</h2>
    <div role="group" aria-label="Pilgrim 1" id="row">
      <label for="cname">Name</label>
      <input id="cname" type="text" />
      <label for="cage">Age</label>
      <input id="cage" type="number" />
    </div>
    <script>
      (function () {
        const state = { name: "", age: "" };
        window.__state = state;
        const name = document.getElementById("cname");
        const age = document.getElementById("cage");
        name.addEventListener("input", (e) => { state.name = e.target.value; });
        age.addEventListener("input", (e) => { state.age = e.target.value; });
        window.__render = function () {
          name.value = state.name;
          age.value = state.age;
        };
        document.addEventListener("change", () => setTimeout(window.__render, 0), true);
      })();
    </script>
  </body>
</html>
