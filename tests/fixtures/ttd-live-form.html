<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tirumala Tirupati Devasthanams</title>
  </head>
  <body>
    <!-- Synthetic copy of the live Sri PAT floating-label layout: labels are
      siblings (no for=), Gender/Photo ID Proof are read-only text inputs.
      NOT a copy of portal assets. -->
    <div class="page-title">Special Entry Darshan (Sri PAT)</div>
    <div>
      <div>Pilgrim Details</div>
      <div class="pilgrim-row">
        <div style="position: relative">
          <input class="floating-input" type="text" name="fname" id="0" />
          <div><label>Name <sup>*</sup></label></div>
        </div>
        <div style="position: relative">
          <input class="floating-input" type="number" name="age" id="0" />
          <div><label>Age <sup>*</sup></label></div>
        </div>
        <div style="position: relative">
          <input class="floating-input" type="text" name="gender" id="0" readonly />
          <div><label>Gender <sup>*</sup></label></div>
        </div>
        <div style="position: relative">
          <input class="floating-input" type="text" name="photoIdType" id="0" readonly />
          <div><label>Photo ID Proof <sup>*</sup></label></div>
        </div>
        <div style="position: relative">
          <input class="floating-input" type="text" name="idProofNumber" id="0" />
          <div><label>Photo Id Number <sup>*</sup></label></div>
        </div>
      </div>
    </div>
  </body>
</html>
