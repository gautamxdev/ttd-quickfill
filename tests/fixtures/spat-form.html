<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TTD Online Services</title>
  </head>
  <body>
    <!-- Synthetic fixture mirroring the observed Sri PAT (SPAT) layout from a
      screenshot: heading "Special Entry Darshan (Sri PAT)", a Darshan Details
      summary card, and ONE "Pilgrim Details" card holding one row per ticket
      (Name / Age / Gender / Photo ID Proof / Photo Id Number). NOT a copy of
      the live portal. -->
    <header><h1>Special Entry Darshan (Sri PAT)</h1></header>
    <main>
      <section aria-label="Darshan Details">
        <span>Darshan Date</span><span>13/10/2026</span>
        <span>Darshan Slot</span><span>8:00 AM</span>
        <span>No. of Tickets</span><span>4</span>
        <span>Total Cost</span><span>₹800</span>
      </section>

      <div class="card">
        <h2>Pilgrim Details</h2>
        <div class="pilgrim-row" id="row1">
          <label for="r1-name">Name *</label><input id="r1-name" type="text" />
          <label for="r1-age">Age *</label><input id="r1-age" type="number" />
          <label for="r1-gender">Gender *</label>
          <select id="r1-gender">
            <option value="">-- Select --</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
          <label for="r1-idtype">Photo ID Proof *</label>
          <select id="r1-idtype">
            <option value="" disabled selected>Select ID</option>
            <option value="AADHAR">Aadhaar Card</option>
            <option value="PASSPORT">Passport</option>
            <option value="VOTER">Voter ID</option>
          </select>
          <label for="r1-idno">Photo Id Number *</label><input id="r1-idno" type="text" />
        </div>
        <div class="pilgrim-row" id="row2">
          <label for="r2-name">Name *</label><input id="r2-name" type="text" />
          <label for="r2-age">Age *</label><input id="r2-age" type="number" />
          <label for="r2-gender">Gender *</label>
          <select id="r2-gender">
            <option value="">-- Select --</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
          <label for="r2-idtype">Photo ID Proof *</label>
          <select id="r2-idtype">
            <option value="" disabled selected>Select ID</option>
            <option value="AADHAR">Aadhaar Card</option>
            <option value="PASSPORT">Passport</option>
            <option value="VOTER">Voter ID</option>
          </select>
          <label for="r2-idno">Photo Id Number *</label><input id="r2-idno" type="text" />
        </div>
        <div class="pilgrim-row" id="row3">
          <label for="r3-name">Name *</label><input id="r3-name" type="text" />
          <label for="r3-age">Age *</label><input id="r3-age" type="number" />
          <label for="r3-gender">Gender *</label>
          <select id="r3-gender">
            <option value="">-- Select --</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
          <label for="r3-idtype">Photo ID Proof *</label>
          <select id="r3-idtype">
            <option value="" disabled selected>Select ID</option>
            <option value="AADHAR">Aadhaar Card</option>
            <option value="PASSPORT">Passport</option>
            <option value="VOTER">Voter ID</option>
          </select>
          <label for="r3-idno">Photo Id Number *</label><input id="r3-idno" type="text" />
        </div>
        <div class="pilgrim-row" id="row4">
          <label for="r4-name">Name *</label><input id="r4-name" type="text" />
          <label for="r4-age">Age *</label><input id="r4-age" type="number" />
          <label for="r4-gender">Gender *</label>
          <select id="r4-gender">
            <option value="">-- Select --</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
          </select>
          <label for="r4-idtype">Photo ID Proof *</label>
          <select id="r4-idtype">
            <option value="" disabled selected>Select ID</option>
            <option value="AADHAR">Aadhaar Card</option>
            <option value="PASSPORT">Passport</option>
            <option value="VOTER">Voter ID</option>
          </select>
          <label for="r4-idno">Photo Id Number *</label><input id="r4-idno" type="text" />
        </div>
      </div>
    </main>
  </body>
</html>
